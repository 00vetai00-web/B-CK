html,body,#root{width:100%;height:100%;overflow:hidden}

::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#2a3446;border-radius:3px}
input::placeholder{color:#64748B}button{font-family:inherit}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.rowtrack::-webkit-scrollbar{display:none}

.nfcard .nfinfo{opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
@media (hover:hover){.nfcard:hover{transform:scale(1.1);z-index:6;box-shadow:0 14px 34px rgba(0,0,0,.65)}.nfcard:hover .nfinfo{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .4s ease both}.slideup{animation:slideUp .35s ease both}.no-tap{-webkit-tap-highlight-color:transparent}
.epgcell{cursor:pointer;transition:background .15s}.epgcell:hover{filter:brightness(1.25)}
.cat-collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.4,0,.2,1);opacity:0}
.cat-collapse.open{grid-template-rows:1fr;opacity:1;transition:grid-template-rows .35s cubic-bezier(.4,0,.2,1),opacity .3s ease}
.cat-collapse-inner{overflow:hidden;min-height:0}
.cat-toggle:focus-visible{outline:2px solid #00E5FF;outline-offset:2px}

function fmtClock(ts){if(!ts)return"";const d=new Date(ts);return pad2(d.getHours())+":"+pad2(d.getMinutes());}
function fmtDateShort(ts){if(!ts)return"";const d=new Date(ts);return d.getDate()+" "+MO[d.getMonth()];}
function fmtRelDay(ts){if(!ts)return"";const d=new Date(ts),n=new Date();const t=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();const v=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();const df=Math.round((v-t)/86400000);if(df===0)return SV.today;if(df===1)return SV.tomorrow;if(df===-1)return SV.yesterday;return WD[(d.getDay()+6)%7];}
function fmtDur(sec){if(!sec||sec<0)return"0m";const m=Math.floor(sec/60),h=Math.floor(m/60),mm=m%60;if(h===0)return m+"m";if(mm===0)return h+"t";return h+"t "+mm+"m";}
function fmtCount(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ");}
function normSv(s){return (s||"").toLowerCase().normalize("NFC").replace(/[^a-z0-9\u00e5\u00e4\u00f6\s]/gi,"").replace(/\s+/g," ").trim();}

function isSeLiveCategory(cat){const c=(cat||"").trim();return /^(SE|VIP\s+SE)\s*[|:]/i.test(c)||/^SE\s/i.test(c);}
function isSvEnVodCategory(cat){

// Builds the two-level SE/DK structure from provider live categories.
// Robust: exact + normalized group matching, dedup by url, relabel, empty/collision handling.
function buildCurated(liveCats){
  liveCats=liveCats||{};
  const availKeys=Object.keys(liveCats);
  const normIndex={};availKeys.forEach(k=>{const n=normGroup(k);(normIndex[n]||(normIndex[n]=[])).push(k);});
  const usedGroups=new Set();const warnings=[];const flat={};
  const regions=CURATED.regions.map(region=>{
    const subs=region.subs.map(sub=>{
      const seen=new Set();const channels=[];const matchedGroups=[];
      // resolve source groups: exact first, then normalized
      const candidates=[];
      for(const s of sub.src){
        if(liveCats[s]){candidates.push(s);}
        else{const nk=normGroup(s);(normIndex[nk]||[]).forEach(g=>{if(candidates.indexOf(g)<0)candidates.push(g);});}
      }
      for(const g of candidates){
        if(usedGroups.has(g))continue;
        matchedGroups.push(g);usedGroups.add(g);
        for(const ch of liveCats[g]){
          const key=(ch.url||"")+"|"+(ch.name||"");
          if(seen.has(key))continue;seen.add(key);
          channels.push({...ch,group:sub.label,srcGroup:g});
        }
      }
      if(!channels.length)warnings.push("Empty sub-category: "+sub.label+" (no source group matched "+sub.src.join(" / ")+")");
      flat[sub.label]=channels;
      return {label:sub.label,icon:sub.icon,channels,count:channels.length,available:channels.length>0,matchedGroups};
    });
    const avail=subs.filter(s=>s.available);
    const total=avail.reduce((a,s)=>a+s.count,0);
    return {id:region.id,label:region.label,name:region.name,flag:region.flag,subs:avail,allSubs:subs,total};
  });

  regions.forEach(r=>r.subs.forEach(s=>s.channels.forEach(c=>{if(!idseen.has(c.id)){idseen.add(c.id);allChannels.push(c);}})));
  return {regions,flat,allChannels,warnings,total:allChannels.length};
}

    const r=await fetch(api("/api/playlist/library?url="+encodeURIComponent(url)),{signal:ctrl.signal});

    const L=data&&data.library;
    if(!L||!L.counts||!L.counts.entries)throw new Error("Inga kanaler hittades");

  }catch(e){
    clearTimeout(timer);

  }

function InfiniteGrid({items,render,cols,batch=48}){const[n,setN]=useState(batch);const r=useRef(null);useEffect(()=>{setN(batch);},[items]);useEffect(()=>{const el=r.current;if(!el)return;const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)setN(v=>Math.min(items.length,v+batch));});},{rootMargin:"900px 0px"});io.observe(el);return()=>io.disconnect();},[items]);return <React.Fragment><div style={{display:"grid",gridTemplateColumns:cols,gap:12}}>{items.slice(0,n).map(render)}</div>{n<items.length&&<div ref={r} style={{height:1}}/>}<div style={{textAlign:"center",color:T.faint,fontSize:11,padding:"14px 0"}}>{fmtCount(Math.min(n,items.length))} {SV.of} {fmtCount(items.length)}</div></React.Fragment>;}

function Scroller({children}){const ref=useRef(null);const[cL,setCL]=useState(false);const[cR,setCR]=useState(true);const ck=()=>{const e=ref.current;if(!e)return;setCL(e.scrollLeft>10);setCR(e.scrollLeft<e.scrollWidth-e.clientWidth-10);};useEffect(()=>{ck();},[]);const sc=d=>{if(ref.current)ref.current.scrollBy({left:d*(ref.current.clientWidth*.82),behavior:"smooth"});};const arw=side=>({position:"absolute",[side]:0,top:0,bottom:26,zIndex:8,width:"4vw",minWidth:36,background:"linear-gradient(to "+(side==="left"?"right":"left")+",rgba(10,14,26,.75),transparent)",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff"});return <div style={{position:"relative"}}>{cL&&<button onClick={()=>sc(-1)} style={arw("left")}><Ico n="cL" sz={22}/></button>}<div ref={ref} onScroll={ck} className="rowtrack">{children}</div>{cR&&<button onClick={()=>sc(1)} style={arw("right")}><Ico n="cR" sz={22}/></button>}</div>;}
function RowHead({title,onAll,count}){return <div style={{display:"flex",alignItems:"baseline",gap:10,padding:"0 4vw"}}><h3 style={{color:"#e5e5e5",fontSize:"clamp(15px,1.6vw,20px)",fontWeight:700,margin:0}}>{title}</h3>{onAll&&<button onClick={onAll} style={{background:"none",border:"none",color:T.accent,fontSize:12,fontWeight:600,cursor:"pointer",display:"inline-flex",alignItems:"center",gap:2}}>{SV.all} ({fmtCount(count)})<Ico n="chevR" sz={12} c={T.accent}/></button>}</div>;}
function Top10Row({title,items,onOpen,onPlay,onList,favs,mobile}){if((items||[]).length<3)return null;return <div><RowHead title={title}/><div className="rowtrack" style={{alignItems:"flex-end"}}>{items.slice(0,10).map((it,i)=><div key={it.id} style={{display:"flex",alignItems:"flex-end",flexShrink:0}}><div style={{fontFamily:T.font,fontWeight:900,fontSize:mobile?82:128,lineHeight:.72,color:"transparent",WebkitTextStroke:(mobile?2:3)+"px "+T.faint,marginRight:mobile?-12:-20,userSelect:"none",flexShrink:0}}>{i+1}</div><VodCard item={it} inList={favs.has(it.id)} onOpen={onOpen} onPlay={onPlay} onList={onList} w={mobile?108:150}/></div>)}</div></div>;}

function Billboard({items,epgFor,onPlay,onOpen,onList,favs,mobile}){const[idx,setIdx]=useState(0);useEffect(()=>{if(items.length<2)return;const iv=setInterval(()=>setIdx(i=>(i+1)%items.length),8000);return()=>clearInterval(iv);},[items.length]);if(!items.length)return null;const it=items[idx%items.length];const cl=catClr(it.group);const e=it.type==="live"?epgFor(it):null;const now=e&&e.now;const inList=favs.has(it.id);const[meta,setMeta]=useState(()=>metaOf(it));useEffect(()=>{let on=true;setMeta(metaOf(it));if(it.type!=="live")fetchMeta(it).then(m=>{if(on)setMeta(m&&m.found?m:null);});return()=>{on=false;};},[it]);const bd=meta?(meta.backdrop||(meta.trailer?"https://img.youtube.com/vi/"+meta.trailer+"/maxresdefault.jpg":null)):null;const tlabel=it.type==="live"?SV.liveChannel:it.type==="movie"?SV.featuredFilm:SV.featuredSeries;

    <div style={{position:"absolute",inset:0,background:"linear-gradient(to top,#0a0e1a 5%,transparent 46%),linear-gradient(to right,rgba(10,14,26,.9) 0%,transparent 60%)"}}/>
    <div style={{position:"absolute",left:0,right:0,bottom:mobile?"9%":"15%",padding:"0 4vw",maxWidth:760}}>
      <div style={{display:"inline-flex",alignItems:"center",gap:6,marginBottom:12}}><Ico n={it.type==="live"?"signal":it.type==="movie"?"film":"stack"} sz={mobile?13:15} c={T.accent}/><span style={{color:T.accent,fontSize:mobile?10:12,fontWeight:800,letterSpacing:2}}>{tlabel}</span></div>
      <h1 style={{fontSize:mobile?"32px":"clamp(38px,6vw,72px)",fontWeight:900,margin:"0 0 10px",lineHeight:1,textShadow:"0 4px 20px rgba(0,0,0,.5)"}}>{it.title||it.name}</h1>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:mobile?14:18,flexWrap:"wrap"}}>{it.type==="live"&&<span style={{color:T.accent,fontSize:13,fontWeight:800}}>● LIVE</span>}<span style={{color:T.sub,fontSize:mobile?13:15,fontWeight:600}}>{it.group}</span>{meta&&<span style={{...chip,background:"rgba(245,197,24,.14)",color:"#f5c518"}}><Ico n="star" sz={11} c="#f5c518"/>{meta.rating}</span>}{it.year&&<span style={{color:T.dim,fontSize:14}}>{it.year}</span>}{now&&<span style={{color:T.dim,fontSize:mobile?12:14}}>{SV.nowPlaying}: {now.title}</span>}</div>

        <button onClick={()=>onOpen(it)} style={{...btnGray,padding:mobile?"10px 18px":"12px 26px",fontSize:mobile?15:17}}><Ico n="info" sz={mobile?18:20} c="#fff"/> {SV.moreInfo}</button>

/* ═══════════════ EPG GRID (XMLTV via server bulk API) ═══════════════ */
function EPGGrid({channels,epgMap,epgUrl,onPlay,onOpen,mobile}){
  const[winStart,setWinStart]=useState(()=>{const d=new Date();d.setMinutes(d.getMinutes()<30?0:30,0,0);return d.getTime();});
  const[sched,setSched]=useState({});
  const[sel,setSel]=useState(null);
  const[view,setView]=useState("grid");
  const[loading,setLoading]=useState(false);
  const[groupF,setGroupF]=useState("");
  const[nowTick,setNowTick]=useState(0);
  const HOURS=mobile?2:3, SLOT=30, COLW=mobile?90:120, ROWH=58, CHW=mobile?92:150;
  const slots=[];for(let i=0;i<(HOURS*60/SLOT);i++)slots.push(winStart+i*SLOT*60000);
  const winEnd=winStart+HOURS*3600000;
  const groups=useMemo(()=>{const s=new Set();channels.forEach(c=>{if(c.group)s.add(c.group);});return[...s].sort((a,b)=>a.localeCompare(b,"sv"));},[channels]);
  const filtered=useMemo(()=>groupF?channels.filter(c=>c.group===groupF):channels,[channels,groupF]);
  const shown=filtered.slice(0,100);
  const nowPx=Math.max(0,((Date.now()-winStart)/(winEnd-winStart))*slots.length*COLW);
  useEffect(()=>{const iv=setInterval(()=>setNowTick(t=>t+1),30000);return()=>clearInterval(iv);},[]);
  useEffect(()=>{if(!epgUrl||!shown.length){setSched({});return;}let on=true;const keys=shown.map(epgChKey).filter(Boolean);const cacheKey=epgUrl+"|"+winStart+"|"+keys.join(",");const cached=EPGC.get(cacheKey);if(cached){setSched(cached);setLoading(false);}else setLoading(true);
    const q=api("/api/epg/bulk?url="+encodeURIComponent(epgUrl)+"&channels="+encodeURIComponent(keys.join(",")));fetch(q).then(r=>r.ok?r.json():{}).then(data=>{data=data||{};EPGC.set(cacheKey,data);if(on)setSched(data);}).catch(()=>{if(on)setSched({});}).finally(()=>{if(on)setLoading(false);});return()=>{on=false;};},[epgUrl,winStart,shown.length,shown.map(c=>c.id).join(",")]);
  const progsFor=c=>{const k=epgChKey(c);const arr=(k&&sched[k])||[];const e=epgMap[k]||epgMap[c.tvgId];const list=arr.length?arr:(e?[e.now,e.next].filter(Boolean):[]);return list.filter(p=>p&&p.stop>winStart&&p.start<winEnd);};
  return <div style={{padding:mobile?"6px 0 0":"10px 0 0"}}>
    <div style={{display:"flex",alignItems:"center",gap:10,padding:"0 4vw 12px",flexWrap:"wrap"}}>
      <button onClick={()=>setWinStart(w=>w-HOURS*3600000)} style={{...btnGray,padding:"6px 12px"}}><Ico n="cL" sz={14} c="#fff"/></button>
      <div style={{fontWeight:700,fontSize:14,minWidth:150,textAlign:"center"}}>{fmtRelDay(winStart)} · {fmtClock(winStart)}–{fmtClock(winEnd)}</div>
      <button onClick={()=>setWinStart(w=>w+HOURS*3600000)} style={{...btnGray,padding:"6px 12px"}}><Ico n="cR" sz={14} c="#fff"/></button>
      <button onClick={()=>{const d=new Date();d.setMinutes(d.getMinutes()<30?0:30,0,0);setWinStart(d.getTime());}} style={{...btnGray,padding:"6px 14px"}}>{SV.now}</button>
      <div style={{display:"flex",gap:6,marginLeft:"auto"}}><button onClick={()=>setView("grid")} style={pillBtn(view==="grid")}><Ico n="grid" sz={14} c={view==="grid"?T.accent:T.dim}/> {SV.epgGrid}</button><button onClick={()=>setView("list")} style={pillBtn(view==="list")}><Ico n="list" sz={14} c={view==="list"?T.accent:T.dim}/> {SV.epgList}</button></div>
      {loading&&<span style={{color:T.dim,fontSize:11}}>{SV.loading}</span>}
    </div>
    {groups.length>1&&<div style={{display:"flex",gap:6,padding:"0 4vw 10px",overflowX:"auto",flexWrap:"nowrap"}}><button onClick={()=>setGroupF("")} style={pillBtn(!groupF)}>{SV.allCategories}</button>{groups.map(g=><button key={g} onClick={()=>setGroupF(g)} style={{...pillBtn(groupF===g),flexShrink:0,whiteSpace:"nowrap"}}>{g}</button>)}</div>}
    {view==="list"?<div style={{padding:"0 4vw 24px",display:"flex",flexDirection:"column",gap:6}}>{shown.map(c=>{const e=epgMap[epgChKey(c)];const now=e&&e.now,next=e&&e.next;return <div key={c.id} onClick={()=>onOpen(c)} style={{display:"flex",gap:12,padding:"10px 12px",borderRadius:8,background:T.panel,cursor:"pointer",border:"1px solid "+T.border}}>
      <div style={{width:36,height:36,borderRadius:8,background:catClr(c.group)+"22",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Ico n="signal" sz={16} c={catClr(c.group)}/></div>
      <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:700,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{c.name}</div><div style={{fontSize:11,color:T.sub,marginTop:2}}>{now?<React.Fragment><span style={{color:T.accent,fontWeight:700}}>{SV.nowPlaying}: </span>{now.title}{now.stop?" · "+fmtClock(now.start)+"–"+fmtClock(now.stop):""}</React.Fragment>:SV.noEpgData}</div>{next&&<div style={{fontSize:10.5,color:T.dim,marginTop:2}}>{SV.upNext}: {next.title}{next.start?" · "+fmtClock(next.start):""}</div>}</div>
      <button onClick={ev=>{ev.stopPropagation();onPlay(c);}} style={{...btnPlay,padding:"6px 12px",fontSize:12}}><Ico n="play" sz={14} c="#000"/></button>
    </div>;})}</div>:<React.Fragment>
    <div style={{overflowX:"auto",padding:"0 4vw 40px"}}>
      <div style={{minWidth:CHW+slots.length*COLW}}>
        <div style={{display:"flex",position:"sticky",top:0,zIndex:3,background:T.bg}}>
          <div style={{width:CHW,minWidth:CHW,flexShrink:0}}/>
          {slots.map(s=><div key={s} style={{width:COLW,minWidth:COLW,color:T.dim,fontSize:11,fontFamily:"'JetBrains Mono',monospace",fontWeight:600,padding:"4px 6px",borderLeft:"1px solid "+T.border}}>{fmtClock(s)}</div>)}
        </div>
        {shown.map(c=>{const progs=progsFor(c);return <div key={c.id} style={{display:"flex",height:ROWH,borderTop:"1px solid "+T.border}}>
          <div onClick={()=>onOpen(c)} style={{width:CHW,minWidth:CHW,flexShrink:0,display:"flex",alignItems:"center",gap:8,padding:"0 8px",cursor:"pointer",background:T.bg,position:"sticky",left:0,zIndex:2}}>
            <div style={{width:30,height:30,borderRadius:7,flexShrink:0,background:catClr(c.group)+"22",display:"flex",alignItems:"center",justifyContent:"center",border:"1px solid "+catClr(c.group)+"44"}}><Ico n="signal" sz={13} c={catClr(c.group)}/></div>
            {!mobile&&<div style={{minWidth:0}}><div style={{fontSize:12,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{c.name}</div></div>}
          </div>
          <div style={{position:"relative",flex:1,display:"flex"}}>
            {slots.map(s=><div key={s} style={{width:COLW,minWidth:COLW,borderLeft:"1px solid "+T.border}}/>)}
            {nowTick>=0&&Date.now()>=winStart&&Date.now()<=winEnd&&<div style={{position:"absolute",left:nowPx,top:0,bottom:0,width:2,background:T.danger,zIndex:4,pointerEvents:"none",boxShadow:"0 0 6px "+T.danger}}/>}
            {progs.map((p,i)=>{const left=Math.max(0,((p.start-winStart)/60000/SLOT)*COLW);const width=Math.max(24,(((Math.min(p.stop,winEnd)-Math.max(p.start,winStart))/60000)/SLOT)*COLW-2);const live=p.start<=Date.now()&&p.stop>Date.now();const gc=genreClr(p.category);const tip=p.title+(p.desc?" — "+p.desc:"")+" · "+fmtClock(p.start)+"–"+fmtClock(p.stop);return <div key={i} className="epgcell" title={tip} onClick={()=>setSel({c,p,live})} style={{position:"absolute",left:left,top:4,width:width,height:ROWH-10,background:gc+(live?"33":"1c"),borderLeft:"3px solid "+gc,borderRadius:4,padding:"5px 8px",overflow:"hidden",cursor:"pointer"}}>
              <div style={{fontSize:11.5,fontWeight:live?800:600,color:live?"#fff":T.sub,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.title}</div>
              <div style={{fontSize:9.5,color:T.dim,fontFamily:"'JetBrains Mono',monospace"}}>{fmtClock(p.start)}</div>
            </div>;})}
          </div>
        </div>;})}
      </div>

/* ═══════════════ CHANNEL LIST (grouped by category) ═══════════════ */
function ChannelGroups({liveCats,favs,epgFor,onOpen,onPlay,onList,onHide,mobile}){
  const[expanded,setExpanded]=useState({});
  const[q,setQ]=useState("");
  const groups=useMemo(()=>{
    const out=[];
    const all=[];
    Object.entries(liveCats||{}).forEach(([cat,items])=>{
      const ch=items.filter(c=>!HC.has(c.id)&&(!q||svMatch(c.name,q)));
      if(ch.length)out.push({cat,channels:ch});
      all.push(...ch);
    });
    const favCh=all.filter(c=>favs.has(c.id));
    return {favCh,cats:out};
  },[liveCats,q,favs]);
  useEffect(()=>{if(q)setExpanded(p=>{const n={...p};groups.cats.forEach(g=>{n[g.cat]=true;});return n;});},[q,groups.cats.length]);
  const liveCols=mobile?"1fr":"repeat(auto-fill,minmax(230px,1fr))";
  const tog=cat=>setExpanded(p=>({...p,[cat]:!p[cat]}));
  const onTogKey=(e,cat)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tog(cat);}};
  return <div style={{padding:"6px 4vw 0"}}>
    <div style={{position:"relative",marginBottom:14,maxWidth:420}}><Ico n="search" sz={14} c={T.dim} s={{position:"absolute",left:10,top:11}}/><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Filtrera kanaler…" aria-label="Filtrera kanaler" style={{width:"100%",padding:"10px 12px 10px 34px",borderRadius:8,background:T.panel,border:"1px solid "+T.border,color:"#fff",fontSize:13,outline:"none",fontFamily:T.font}}/></div>
    {groups.favCh.length>0&&<div style={{marginBottom:18}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><Ico n="star" sz={16} c={T.warn}/><h3 style={{fontSize:16,fontWeight:800,margin:0}}>{SV.favorites}</h3><span style={{color:T.dim,fontSize:12}}>{groups.favCh.length}</span></div>
      <div style={{display:"grid",gridTemplateColumns:liveCols,gap:12}}>{groups.favCh.map(c=><LiveCard key={"fav_"+c.id} item={c} epg={epgFor(c)} inList onOpen={onOpen} onPlay={onPlay} onList={onList} w={"100%"}/>)}</div>
    </div>}
    {groups.cats.map(g=>{const open=!!expanded[g.cat];const panelId="cat-panel-"+g.cat.replace(/\W+/g,"-");return <div key={g.cat} style={{marginBottom:14}}>
      <button type="button" className="cat-toggle" role="button" aria-expanded={open} aria-controls={panelId} onClick={()=>tog(g.cat)} onKeyDown={e=>onTogKey(e,g.cat)} style={{display:"flex",alignItems:"center",gap:10,width:"100%",background:T.panel,border:"1px solid "+T.border,borderRadius:10,padding:"10px 14px",cursor:"pointer",fontFamily:T.font,marginBottom:open?10:0}}>
        <div style={{width:28,height:28,borderRadius:7,background:catClr(g.cat)+"22",display:"flex",alignItems:"center",justifyContent:"center"}} aria-hidden="true"><Ico n="tv" sz={14} c={catClr(g.cat)}/></div>
        <span style={{fontSize:14,fontWeight:700,flex:1,textAlign:"left"}}>{g.cat}</span>
        <span style={{color:T.dim,fontSize:12}}>{g.channels.length}</span>
        <Ico n={open?"chevDown":"chevR"} sz={16} c={T.dim}/>
        <span className="sr-only" style={{position:"absolute",width:1,height:1,padding:0,margin:-1,overflow:"hidden",clip:"rect(0,0,0,0)",border:0}}>{open?SV.collapseCategory:SV.expandCategory}</span>
      </button>
      <div id={panelId} className={"cat-collapse"+(open?" open":"")} role="region" aria-label={g.cat}>
        <div className="cat-collapse-inner">
          <div style={{display:"grid",gridTemplateColumns:liveCols,gap:12,paddingTop:open?4:0}}>{g.channels.map(c=><div key={c.id} style={{position:"relative"}}><LiveCard item={c} epg={epgFor(c)} inList={favs.has(c.id)} onOpen={onOpen} onPlay={onPlay} onList={onList} w={"100%"}/><button type="button" title={SV.hideChannel} aria-label={SV.hideChannel+" "+c.name} onClick={()=>onHide(c.id)} style={{position:"absolute",top:8,right:8,background:"rgba(0,0,0,.55)",border:"none",borderRadius:6,width:26,height:26,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Ico n="x" sz={12} c={T.dim}/></button></div>)}</div>
        </div>
      </div>

function TakeoverPrompt({onKicked}){
  const[req,setReq]=useState(null);
  const[busy,setBusy]=useState(false);
  useEffect(()=>{let dead=false;const poll=async()=>{const r=await Auth.json("/api/auth/takeover/pending");if(dead)return;if(r.status===401){Auth.clear();onKicked&&onKicked();return;}if(r.ok&&r.data&&r.data.pending&&r.data.request)setReq(r.data.request);else setReq(null);};poll();const iv=setInterval(poll,2500);return()=>{dead=true;clearInterval(iv);};},[onKicked]);
  const respond=async(accept)=>{if(!req||busy)return;setBusy(true);const r=await Auth.json("/api/auth/takeover/respond",{method:"POST",body:JSON.stringify({requestId:req.requestId,accept})});setBusy(false);if(!accept)setReq(null);if(accept){Auth.clear();onKicked&&onKicked(true);}};
  if(!req)return null;
  return <div style={{position:"fixed",inset:0,zIndex:980,background:"rgba(0,0,0,.82)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}} className="fade">

  </div>;
}

const HJALP_STEPS=[
  {id:"type",q:SV.helpQ1,opts:[["movie",SV.movies],["series",SV.series],["both","Båda"]]},
  {id:"mood",q:SV.helpQ2,opts:[["action","Action & spänning"],["comedy","Komedi"],["drama","Drama"],["thriller","Thriller"],["scifi","Sci-Fi & fantasy"],["family","Familj"],["doc","Dokumentär"]]},
  {id:"pace",q:SV.helpQ3,opts:[["short","Kort kväll"],["medium","Lagom"],["binge","Maraton"]]},
  {id:"fresh",q:SV.helpQ4,opts:[["new","Överraska mig"],["popular",SV.popular],["classic","Högt betygsatt"]]},
  {id:"lang",q:SV.helpQ5,opts:[["sv","Svenskt / nordiskt"],["intl","Internationellt"],["any","Spelar ingen roll"]]},
];
const MOOD_KW={action:["action","äventyr","krig","crime","kriminal","sport"],comedy:["komedi","comedy","humor"],drama:["drama","romance","romantik"],thriller:["thriller","mystery","skräck","horror","spänning"],scifi:["sci","science","fantasy","rymd","future"],family:["family","barn","kids","animation","barnfilm"],doc:["documentary","dokumentär","natur","history"]};
function helpScore(item,ans,meta){
  let s=Math.random()*0.4;
  const blob=((meta&&meta.genres)||[]).join(" ").toLowerCase()+" "+(item.group||"").toLowerCase()+" "+(item.name||item.title||"").toLowerCase();
  const moods=MOOD_KW[ans.mood]||[];
  if(moods.some(m=>blob.includes(m)))s+=4;
  if(ans.fresh==="popular")s+=PC.count(item.id);
  if(ans.fresh==="classic"&&meta&&meta.rating)s+=meta.rating*0.8;
  if(ans.fresh==="new"&&(!meta||!meta.rating))s+=1.5;
  if(ans.lang==="sv"&&/(sv|swed|nord|scand|sverige|dansk|norsk)/i.test(blob))s+=2.5;
  if(ans.lang==="intl"&&/(us|uk|international|world)/i.test(blob))s+=1;
  if(ans.pace==="short"&&item.type==="movie")s+=1.2;
  if(ans.pace==="binge"&&item.type==="series")s+=2;
  if(meta&&meta.rating)s+=meta.rating*0.15;
  return s;
}
function HjalpWizard({movies,series,onOpen,onPlay,onClose,mobile}){

  const optBtn=(on,v)=>({padding:"11px 14px",borderRadius:10,cursor:"pointer",fontFamily:T.font,fontWeight:700,fontSize:13,textAlign:"left",border:on?"1.5px solid "+T.accent:"1.5px solid "+T.border,background:on?T.accent+"18":T.panel,color:on?T.text:T.sub});
  return <div onClick={onClose} style={{position:"fixed",inset:0,zIndex:950,background:"rgba(0,0,0,.82)",backdropFilter:"blur(8px)",display:"flex",alignItems:"center",justifyContent:"center",padding:mobile?12:24}} className="fade">
    <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:720,maxHeight:"90vh",overflow:"hidden",display:"flex",flexDirection:"column",background:"#0d1320",borderRadius:T.radius,border:"1px solid "+T.border,boxShadow:T.shadow}} className="slideup">
      <div style={{padding:"14px 18px",borderBottom:"1px solid "+T.border,display:"flex",alignItems:"center",justifyContent:"space-between",background:"linear-gradient(135deg,rgba(0,229,255,.08),rgba(77,71,255,.06))"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}><img src={BRAND.help} alt="" style={{width:28,height:28,opacity:.95}}/><div><div style={{fontSize:17,fontWeight:800}}>{SV.helpTitle}</div><div style={{fontSize:11,color:T.dim,marginTop:2}}>{SV.helpDesc}</div></div></div>
        <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer"}}><Ico n="x" sz={18} c={T.dim}/></button>
      </div>
      <div style={{padding:18,overflowY:"auto",flex:1}}>
        {!done?<React.Fragment>
          <div style={{fontSize:11,color:T.accent,fontWeight:800,letterSpacing:1,marginBottom:8}}>FRÅGA {step+1} / {HJALP_STEPS.length}</div>

          {tips.movies.length>0&&<div style={{marginBottom:18}}><div style={{fontSize:12,color:T.dim,fontWeight:800,letterSpacing:1,marginBottom:10}}>{SV.helpMovies.toUpperCase()}</div><div style={{display:"grid",gridTemplateColumns:mobile?"repeat(2,1fr)":"repeat(5,1fr)",gap:10}}>{tips.movies.map(it=><VodCard key={it.id} item={it} inList={false} onOpen={it=>{onClose();onOpen(it);}} onPlay={it=>{onClose();onPlay(it);}} onList={()=>{}} w={"100%"}/>)}</div></div>}

        </React.Fragment>}
      </div>
      <div style={{padding:"12px 18px",borderTop:"1px solid "+T.border,display:"flex",gap:8,justifyContent:"flex-end",flexWrap:"wrap"}}>
        {!done?<React.Fragment>
          {step>0&&<button onClick={()=>setStep(s=>s-1)} style={btnGray}>{SV.helpBack}</button>}
          <button disabled={!ans[cur.id]||busy} onClick={()=>{if(step<HJALP_STEPS.length-1)setStep(s=>s+1);else run();}} style={{...btnPlay,opacity:(!ans[cur.id]||busy)?0.5:1}}>{step<HJALP_STEPS.length-1?SV.helpNext:(busy?SV.loading:SV.helpDone)}</button>
        </React.Fragment>:<React.Fragment>
          <button onClick={()=>{setDone(false);setStep(0);setAns({});setTips({movies:[],series:[]});}} style={btnGray}>{SV.helpAgain}</button>
          <button onClick={onClose} style={btnPlay}>{SV.back}</button>
        </React.Fragment>}
      </div>
    </div>
  </div>;
}

/* ═══════════════ APP ═══════════════ */

          </div>
        </div>}
        {nav==="movie"&&<div style={{paddingTop:mobile?64:74,...stb}}><div style={{padding:"8px 4vw 4px",display:"flex",alignItems:"center",justifyContent:"space-between"}}><h2 style={{fontSize:mobile?24:30,fontWeight:800,margin:0}}>{SV.movies}</h2><span style={{color:T.dim,fontSize:12}}>{fmtCount(Object.values(movieCats).reduce((a,c)=>a+c.length,0))} {SV.titles}</span></div>{Object.keys(movieCats).length?Object.entries(movieCats).map(a=>vodRow(a[0],a[1])):<Empty t={SV.noMovies} onSet={()=>setShowSet(true)}/>}</div>}
        {nav==="series"&&<div style={{paddingTop:mobile?64:74,...stb}}><div style={{padding:"8px 4vw 4px",display:"flex",alignItems:"center",justifyContent:"space-between"}}><h2 style={{fontSize:mobile?24:30,fontWeight:800,margin:0}}>{SV.series}</h2><span style={{color:T.dim,fontSize:12}}>{fmtCount(allShows.length)} {SV.shows}</span></div>{Object.keys(seriesCats).length?Object.entries(seriesCats).map(a=>vodRow(a[0],a[1])):<Empty t={SV.noSeries} onSet={()=>setShowSet(true)}/>}</div>}
        {nav==="live"&&<div style={{padding:mobile?"70px 0 76px":"86px 0 40px"}}>
          <div style={{padding:"0 4vw",display:"flex",alignItems:"center",gap:10,marginBottom:10,flexWrap:"wrap"}}><h2 style={{fontSize:mobile?24:30,fontWeight:800,margin:0}}>{SV.live}</h2>
            <span style={{color:T.dim,fontSize:12}}>{fmtCount(allLiveChannels.length)} {SV.channels.toLowerCase()}</span>
            <div style={{display:"flex",gap:6,marginLeft:"auto",flexWrap:"wrap"}}>{[["channels",SV.channels],["guide",SV.guide],["favorites",SV.favorites]].map(a=><button key={a[0]} onClick={()=>setLiveTab(a[0])} style={pillBtn(liveTab===a[0])}>{a[1]}</button>)}</div></div>
          {!allLiveChannels.length?<Empty t={SV.noChannels} onSet={()=>setShowSet(true)}/>:liveTab==="channels"?<ChannelGroups liveCats={liveCats} favs={favs} epgFor={epgFor} onOpen={openDetail} onPlay={playItem} onList={tFav} onHide={hideChannel} mobile={mobile}/>:liveTab==="guide"?<EPGGrid channels={allLiveChannels} epgMap={epgMap} epgUrl={cfg.epgUrl} onPlay={playItem} onOpen={openDetail} mobile={mobile}/>:(()=>{const fl=allLiveChannels.filter(c=>favs.has(c.id));return fl.length?<div style={{padding:"6px 4vw 0"}}><div style={{display:"grid",gridTemplateColumns:liveCols,gap:12}}>{fl.map(c=><LiveCard key={c.id} item={c} epg={epgFor(c)} inList onOpen={openDetail} onPlay={playItem} onList={tFav} w={"100%"}/>)}</div></div>:<Empty t={SV.noFavLive}/>;})()}
        </div>}
        {nav==="mylist"&&<div style={{padding:mobile?"70px 4vw 76px":"86px 4vw 40px"}}><h2 style={{fontSize:mobile?24:30,fontWeight:800,marginBottom:16}}>{SV.myList}</h2>{!favList.length?<Empty t={SV.noFavorites}/>:<div style={{display:"grid",gridTemplateColumns:posterCols,gap:12}}>{favList.map(it=>it.type==="live"?<div key={it.id} style={{gridColumn:"span 2"}}><LiveCard item={it} epg={epgFor(it)} inList onOpen={openDetail} onPlay={playItem} onList={tFav} w={"100%"}/></div>:<VodCard key={it.id} item={it} inList onOpen={openDetail} onPlay={playItem} onList={tFav} w={"100%"}/>)}</div>}</div>}
        {nav==="search"&&<div style={{paddingTop:mobile?64:80,...stb,minHeight:"100%"}}>
          <div style={{padding:"0 4vw",maxWidth:820,margin:"0 auto"}}><div style={{position:"relative",marginBottom:20}}><Ico n="search" sz={18} c={T.dim} s={{position:"absolute",left:14,top:14}}/><input value={query} onChange={e=>setQuery(e.target.value)} placeholder={SV.searchPlaceholder} autoFocus style={{width:"100%",padding:"13px 14px 13px 42px",borderRadius:8,background:T.panel,border:"1px solid "+T.border,color:"#fff",fontSize:15,outline:"none",fontFamily:T.font}}/></div></div>
          {!query&&<div style={{textAlign:"center",padding:60,color:T.dim}}><Ico n="search" sz={38} c={T.dim}/><p style={{marginTop:12,fontSize:14}}>{SV.searchHint}</p></div>}
          {!query&&RS.list().length>0&&<div style={{padding:"0 4vw 16px",maxWidth:820,margin:"0 auto"}}><div style={{fontSize:11,color:T.dim,fontWeight:700,letterSpacing:1,marginBottom:8}}>{SV.recentSearches.toUpperCase()}</div><div style={{display:"flex",flexWrap:"wrap",gap:8}}>{RS.list().map(q=><button key={q} onClick={()=>setQuery(q)} style={{...btnGray,padding:"6px 12px",fontSize:12,borderRadius:20,color:T.text}}>{q}</button>)}</div></div>}
          {results&&<div style={{padding:"0 4vw"}}>
            {results.movie.length>0&&<React.Fragment><RowHead title={SV.movies+" · "+results.movie.length}/><div style={{display:"grid",gridTemplateColumns:posterCols,gap:12,marginBottom:20}}>{results.movie.map(it=><VodCard key={it.id} item={it} inList={favs.has(it.id)} onOpen={openDetail} onPlay={playItem} onList={tFav} w={"100%"}/>)}</div></React.Fragment>}
            {results.series.length>0&&<React.Fragment><RowHead title={SV.series+" · "+results.series.length}/><div style={{display:"grid",gridTemplateColumns:posterCols,gap:12,marginBottom:20}}>{results.series.map(it=><VodCard key={it.id} item={it} inList={favs.has(it.id)} onOpen={openDetail} onPlay={playItem} onList={tFav} w={"100%"}/>)}</div></React.Fragment>}
            {results.live.length>0&&<React.Fragment><RowHead title={SV.live+" · "+results.live.length}/><div style={{display:"grid",gridTemplateColumns:liveCols,gap:12}}>{results.live.map(it=><LiveCard key={it.id} item={it} epg={epgFor(it)} inList={favs.has(it.id)} onOpen={openDetail} onPlay={playItem} onList={tFav} w={"100%"}/>)}</div></React.Fragment>}
            {results.episodes.length>0&&<React.Fragment><RowHead title={SV.episodesLabel+" · "+results.episodes.length}/><div style={{display:"grid",gridTemplateColumns:posterCols,gap:12,marginBottom:20}}>{results.episodes.map(it=><VodCard key={it.id} item={it} inList={favs.has(it.id)} onOpen={openDetail} onPlay={playItem} onList={tFav} w={"100%"}/>)}</div></React.Fragment>}
            {epgSearch.length>0&&<React.Fragment><RowHead title={SV.programmes+" · "+epgSearch.length}/><div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>{epgSearch.map((p,i)=>{const ch=epgChIndex.get(p.channel);return <div key={i} onClick={()=>ch&&playItem(ch)} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",borderRadius:8,background:T.panel,cursor:ch?"pointer":"default",border:"1px solid "+T.border}}><div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:700,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.title}</div><div style={{fontSize:11,color:T.dim,marginTop:2}}>{ch?ch.name:p.channel} · {fmtRelDay(p.start)} {fmtClock(p.start)}–{fmtClock(p.stop)}</div></div>{ch&&<button onClick={ev=>{ev.stopPropagation();playItem(ch);}} style={{...btnPlay,padding:"6px 12px",fontSize:12}}><Ico n="play" sz={14} c="#000"/></button>}</div>;})}</div></React.Fragment>}
            {query&&!results.movie.length&&!results.series.length&&!results.live.length&&!results.episodes.length&&!epgSearch.length&&<div style={{textAlign:"center",padding:50,color:T.dim,fontSize:14}}>{SV.noResults} “{query}”.</div>}
          </div>}
        </div>}
      </React.Fragment>}
    </div>
    {mobile&&nav!=="search"&&!active&&<BottomNav nav={nav} setNav={n=>{setNav(n);setDrill(null);}}/>}
    {detail&&<Detail item={detail} epgFor={epgFor} epgUrl={cfg.epgUrl} related={related} favs={favs} onList={tFav} onPlay={playItem} onOpen={openDetail} onClose={()=>setDetail(null)} mobile={mobile}/>}
    {vpnBlock&&<VpnPlayBlock pending={vpnBlock} onCancel={()=>setVpnBlock(null)} onPlay={startPlay} mobile={mobile}/>}
    {active&&<VPlayer active={active} onClose={closePlayer} favs={favs} onFav={tFav} epg={epgFor(active.item)} epgFor={epgFor} categoryChannels={activeCategoryChannels} onChannelSwitch={switchChannel} mobile={mobile} onEpisode={onEpisode}/>}
    {showHelp&&<HjalpWizard movies={allMovies} series={allShows} onOpen={openDetail} onPlay={playItem} onClose={()=>setShowHelp(false)} mobile={mobile}/>}
    {gate==="app"&&<TakeoverPrompt onKicked={()=>logout()}/>}
    {showSet&&<Settings profile={profile} onClose={()=>setShowSet(false)} lib={lib} sel={sel} cfg={cfg} onUpdateSel={saveSel} idIndex={idIndex} onRestoreHidden={restoreHidden} hiddenTick={hiddenTick} liveChannels={allLiveChannels} onEpgRefresh={()=>{if(cfg.epgUrl)loadEpg(cfg.epgUrl,allLiveChannels);setTick(t=>t+1);}} onRefresh={()=>{if(cfg.playlistUrl)loadPlaylist(cfg.playlistUrl,cfg.epgUrl);}} onSwitchProfile={()=>logout()} onReset={()=>{LS.del("favorites");LS.del("cw");LS.del("setup");LS.del("profile");HC.clear();EpgMatch.reset();setFavs(new Set());setCw([]);setSel(null);logout();}}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
