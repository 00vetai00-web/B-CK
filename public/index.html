<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex">

<link rel="manifest" href="manifest.json">

<link rel="icon" href="/brand/favicons/favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/brand/favicons/apple-touch-icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BÄCK">
<meta name="description" content="BÄCK — private, self-hosted IPTV player with a Netflix-style UI. Your playlist, your server, no telemetry.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;height:100%;overflow:hidden}
body{background:#0a0e1a;color:#fff;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#2a3446;border-radius:3px}
input::placeholder{color:#64748B}button{font-family:inherit}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes kenburns{0%{transform:scale(1.05)}100%{transform:scale(1.16)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.rowtrack{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:16px 4vw 26px;scroll-behavior:smooth;scrollbar-width:none}
.rowtrack::-webkit-scrollbar{display:none}
.nfcard{position:relative;flex:0 0 auto;border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .28s cubic-bezier(.2,.7,.2,1),box-shadow .28s;background:#101828;border:1px solid rgba(255,255,255,.06)}
.nfcard .nfinfo{opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
@media (hover:hover){.nfcard:hover{transform:scale(1.1);z-index:6;box-shadow:0 14px 34px rgba(0,0,0,.65)}.nfcard:hover .nfinfo{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .4s ease both}.slideup{animation:slideUp .35s ease both}.no-tap{-webkit-tap-highlight-color:transparent}
.epgcell{cursor:pointer;transition:background .15s}.epgcell:hover{filter:brightness(1.25)}
.cat-collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.4,0,.2,1);opacity:0}
.cat-collapse.open{grid-template-rows:1fr;opacity:1;transition:grid-template-rows .35s cubic-bezier(.4,0,.2,1),opacity .3s ease}
.cat-collapse-inner{overflow:hidden;min-height:0}
.cat-toggle:focus-visible{outline:2px solid #00E5FF;outline-offset:2px}
</style>
</head>
<body>
<div id="root"></div>
<script defer src="/js/react.js"></script>
<script defer src="/js/react-dom.js"></script>
<script defer src="/js/hls.js"></script>
<script defer src="/js/mpegts.js"></script>
<script defer src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
<script defer src="/js/app.js"></script>

</body>
</html>
