<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex">
<title>BÄCK — Demo</title>
<meta name="theme-color" content="#0a0e1a">
<meta name="description" content="BÄCK — interactive Netflix-style demo. Try the interface with sample content.">
<link rel="icon" href="/brand/favicons/favicon-32.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="script" href="/js/react.js">
<link rel="preload" as="script" href="/js/react-dom.js">
<link rel="preload" as="script" href="/js/demo.js">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;height:100%;overflow:hidden}
body{background:#0a0e1a;color:#fff;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#2a3446;border-radius:3px}
input::placeholder{color:#64748B}button{font-family:inherit}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes kenburns{0%{transform:scale(1.05)}100%{transform:scale(1.16)}}
.rowtrack{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:16px 4vw 26px;scroll-behavior:smooth;scrollbar-width:none}
.rowtrack::-webkit-scrollbar{display:none}
.nfcard{position:relative;flex:0 0 auto;border-radius:6px;overflow:hidden;cursor:pointer;transition:transform .28s cubic-bezier(.2,.7,.2,1),box-shadow .28s;background:#101828}
.nfcard .nfinfo{opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
@media (hover:hover){.nfcard:hover{transform:scale(1.1);z-index:6;box-shadow:0 14px 34px rgba(0,0,0,.65)}.nfcard:hover .nfinfo{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .4s ease both}.slideup{animation:slideUp .35s ease both}.no-tap{-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div id="root"></div>
<script defer src="/js/react.js"></script>
<script defer src="/js/react-dom.js"></script>
<script defer src="/js/hls.js"></script>
<script defer src="/js/demo.js"></script>

</body>
</html>
